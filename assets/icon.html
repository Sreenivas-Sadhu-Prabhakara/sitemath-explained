<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1B1D1E; }
  body { display: grid; place-items: center; }
  /* 12% safe padding per side — the mark fills the middle 76vmin (any maskable) */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- concrete-grey rounded square crossed by a diagonal safety-yellow blade
       segment with an end hook and three carbon graduation ticks -->
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="1" y="1" width="46" height="46" rx="11" fill="#1B1D1E"/>
    <rect x="4" y="4" width="40" height="40" rx="8" fill="#24272A"/>
    <g transform="rotate(-32 24 24)">
      <!-- the yellow steel blade -->
      <rect x="1" y="18.5" width="42" height="11" rx="1.5" fill="#F7C600"/>
      <!-- darker bottom edge for a milled-steel feel -->
      <rect x="1" y="27.5" width="42" height="2" rx="1" fill="#A88600"/>
      <!-- end hook -->
      <rect x="42.5" y="15" width="4.5" height="18" rx="1" fill="#1B1D1E"/>
      <!-- three carbon graduation ticks -->
      <rect x="10" y="18.5" width="2" height="6" fill="#1B1D1E"/>
      <rect x="21" y="18.5" width="2" height="8" fill="#1B1D1E"/>
      <rect x="32" y="18.5" width="2" height="6" fill="#1B1D1E"/>
    </g>
  </svg>
</body>
</html>
